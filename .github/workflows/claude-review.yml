# Claude 리뷰 (PR 댓글에 @claude 를 쓸 때만 실행)
# - 인증: 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN (구독 토큰, `claude setup-token`으로 생성)
# - 리뷰 기준은 저장소 루트의 CLAUDE.md 를 따른다.
# - 이 이벤트(issue_comment)는 기본 브랜치의 워크플로 파일로 실행되므로
#   PR 브랜치에서 이 파일을 바꿔도 이미 병합된 버전이 쓰인다.
#
# 쓰기 방어선 (위에서부터 강함):
#  1) 토큰 권한: permissions.contents 가 read 라서 원격 푸시는 403 으로 실패한다. (S4 에서 실제 확인됨)
#  2) 도구 차단: settings 의 permissions.deny. claude_args 의 --disallowedTools 만으로는
#     Claude 가 로컬 파일 생성·커밋을 하는 것을 막지 못했다(S4 실측). deny 는 allow/ask 보다 우선한다.
#  3) CLAUDE.md 지침: 사용자가 명시적으로 덮어쓰라고 하면 따를 수 있으므로 방어선으로 세지 않는다.
# 이 워크플로는 "읽기 전용을 보장"하지 않는다. 1)이 마지막 보루이고, 2)는 S4 재검증 전까지 미확정이다.
name: Claude 리뷰

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {
              "permissions": {
                "deny": [
                  "Edit",
                  "MultiEdit",
                  "Write",
                  "NotebookEdit",
                  "Bash(git add:*)",
                  "Bash(git commit:*)",
                  "Bash(git push:*)",
                  "Bash(git checkout:*)",
                  "Bash(git switch:*)",
                  "Bash(git reset:*)",
                  "mcp__github_file_ops__*"
                ]
              }
            }
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
