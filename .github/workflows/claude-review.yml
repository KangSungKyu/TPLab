# Claude 리뷰 (PR 댓글에 @claude 를 쓸 때만 실행, 읽기 전용 의도)
# - 인증: 저장소 시크릿 CLAUDE_CODE_OAUTH_TOKEN (구독 토큰, `claude setup-token`으로 생성)
# - 리뷰 기준은 저장소 루트의 CLAUDE.md 를 따른다.
# - 이 이벤트(issue_comment)는 기본 브랜치의 워크플로 파일로 실행되므로
#   PR 브랜치에서 이 파일을 바꿔도 이미 병합된 버전이 쓰인다.
# - 쓰기 도구를 막는 allowedTools/disallowedTools 문법은 첫 실행에서 동작을 확인한다(CI_SETUP_GUIDE.md).
name: Claude 리뷰

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

concurrency:
  group: claude-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      contains(github.event.comment.body, '@claude') &&
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*)"
            --disallowedTools "Edit,MultiEdit,Write,NotebookEdit"
